<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PCHSystem — HTCMC 项目贡献与荣誉系统 Wiki</title>
  <desc id="heroDesc">左侧为项目名称、价值与徽章,右侧为材料收集、施工建造、归档结算三阶段工件流与 !!PCH bind 终端命令。</desc>

  <defs>
    <pattern id="pixelGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.2" height="1.2" fill="#F1F5F9" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="22" fill="#0B1220"/>
  <rect width="1200" height="420" rx="22" fill="url(#pixelGrid)"/>

  <!-- Corner collab pixels -->
  <rect x="1128" y="30" width="10" height="10" rx="2" fill="#4ADE80" opacity="0.22"/>
  <rect x="1152" y="48" width="6"  height="6"  rx="2" fill="#4ADE80" opacity="0.35"/>
  <rect x="40"   y="368" width="8" height="8" rx="2" fill="#4ADE80" opacity="0.28"/>

  <!-- ===== Left: title block (x 64, baseline grid) ===== -->
  <g id="title-block" transform="translate(64 56)">
    <!-- Eyebrow: mark + category -->
    <g id="eyebrow">
      <!-- mini mark: isometric grass block -->
      <g transform="translate(0 -14)">
        <polygon points="11,9.5 22,15.7 11,21.9 0,15.7" fill="#7C5A3C"/>
        <polygon points="11,2 22,8.2 11,14.4 0,8.2" fill="#4ADE80"/>
        <polygon points="0,8.2 11,14.4 11,21.9 0,15.7" fill="#7C5A3C" opacity="0.25"/>
      </g>
      <text x="32" y="6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" font-weight="500" letter-spacing="2.5" fill="#94A3B8">HTCMC · MINECRAFT 社区服</text>
    </g>

    <!-- Title + green caret pixel -->
    <g transform="translate(0 30)">
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="64" font-weight="800" letter-spacing="-1.5" fill="#F1F5F9">PCHSystem</text>
      <rect x="352" y="28" width="16" height="16" fill="#4ADE80"/>
    </g>

    <!-- Value statement -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" font-weight="400" fill="#94A3B8">项目贡献与荣誉系统 · 新手入门 Wiki</text>

    <!-- Chips -->
    <g transform="translate(0 156)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
       font-size="17" font-weight="600">
      <g>
        <rect x="0" y="0" width="118" height="36" rx="18" fill="none" stroke="#4ADE80" stroke-opacity="0.5"/>
        <rect x="13" y="14" width="8" height="8" fill="#4ADE80"/>
        <text x="30" y="24" fill="#4ADE80">材料协作</text>
      </g>
      <g transform="translate(134 0)">
        <rect x="0" y="0" width="102" height="36" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.5"/>
        <rect x="13" y="14" width="8" height="8" fill="#38BDF8"/>
        <text x="30" y="24" fill="#38BDF8">积分榜</text>
      </g>
      <g transform="translate(252 0)">
        <rect x="0" y="0" width="102" height="36" rx="18" fill="none" stroke="#FBBF24" stroke-opacity="0.5"/>
        <rect x="13" y="14" width="8" height="8" fill="#FBBF24"/>
        <text x="30" y="24" fill="#FBBF24">称号库</text>
      </g>
    </g>

    <!-- Meta -->
    <text x="0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#55677F">MCDR · FastAPI · Vue 3 · Wiki by Starlight</text>

    <!-- First command -->
    <g transform="translate(0 262)">
      <rect x="0" y="0" width="330" height="44" rx="12" fill="#0F1B30" stroke="#1F2D44"/>
      <text x="18" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#55677F">$</text>
      <text x="38" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#4ADE80">!!PCH bind</text>
      <rect x="148" y="14" width="10" height="18" fill="#4ADE80" opacity="0.75"/>
      <text x="180" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="16" fill="#55677F">← 第一条命令</text>
    </g>
  </g>

  <!-- ===== Right: artifact flow ===== -->
  <g id="flow" transform="translate(664 72)">
    <!-- column caption -->
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2.5" fill="#55677F">ARTIFACT PIPELINE</text>

    <!-- Stage 1: 材料收集 -->
    <g transform="translate(0 28)">
      <rect width="472" height="90" rx="16" fill="#131C2E" stroke="#4ADE80" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- mini block: grass -->
      <g transform="translate(22 24)">
        <polygon points="10,19 20,24.3 10,29.6 0,24.3" fill="#7C5A3C"/>
        <polygon points="0,14.3 10,19.6 10,24.9 0,19.6" fill="#7C5A3C"/>
        <polygon points="20,14.3 10,19.6 10,24.9 20,19.6" fill="#5A4028"/>
        <polygon points="10,9 20,14.3 10,19.6 0,14.3" fill="#4ADE80"/>
        <polygon points="10,19.6 10,29.6 10,29.6" fill="none"/>
        <polygon points="0,19.3 10,24.6 10,29.9 0,24.6" fill="#7C5A3C" opacity="0"/>
        <polygon points="10,19 20,14.3 20,24.3 10,29.6" fill="#5A4028" opacity="0"/>
        <!-- grass lip -->
        <polygon points="0,14.3 10,19.6 10,22.2 0,16.9" fill="#31A04C"/>
        <polygon points="20,14.3 10,19.6 10,22.2 20,16.9" fill="#278A3E"/>
        <polygon points="0,14.3 10,19.6 10,29.6 0,24.3" fill="none"/>
        <polygon points="0,19.6 10,24.9 10,29.6 0,24.3" fill="#7C5A3C"/>
        <polygon points="20,19.6 10,24.9 10,29.6 20,24.3" fill="#5A4028"/>
      </g>
      <!-- count -->
      <text x="440" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="26" font-weight="700" fill="#4ADE80">×1,024</text>
      <text x="72" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="700" fill="#F1F5F9">材料收集</text>
      <text x="72" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="16" fill="#94A3B8">认领清单 · 多人上交 · 交付确认</text>
    </g>

    <!-- arrow 1 -->
    <g stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M236 118 V 134"/>
      <path d="M230 130 L236 138 L242 130"/>
    </g>

    <!-- Stage 2: 施工建造 -->
    <g transform="translate(0 142)">
      <rect width="472" height="90" rx="16" fill="#131C2E" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- mini block: stone brick -->
      <g transform="translate(22 24)">
        <polygon points="0,14.3 10,19.6 10,29.6 0,24.3" fill="#8B93A1"/>
        <polygon points="20,14.3 10,19.6 10,29.6 20,24.3" fill="#6B7280"/>
        <polygon points="10,9 20,14.3 10,19.6 0,14.3" fill="#CBD5E1"/>
        <path d="M2.5,19.6 10,23.6 M10,24.9 17.5,20.9" stroke="#4B5563" stroke-width="1" opacity="0.6" fill="none"/>
      </g>
      <!-- progress -->
      <rect x="316" y="34" width="112" height="10" rx="5" fill="#1F2D44"/>
      <rect x="316" y="34" width="80" height="10" rx="5" fill="#38BDF8"/>
      <text x="428" y="72" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#38BDF8">72%</text>
      <text x="72" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="700" fill="#F1F5F9">施工建造</text>
      <text x="72" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="16" fill="#94A3B8">方块贡献追踪 · 进度可归因</text>
    </g>

    <!-- arrow 2 -->
    <g stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M236 232 V 248"/>
      <path d="M230 244 L236 252 L242 244"/>
    </g>

    <!-- Stage 3: 归档结算 -->
    <g transform="translate(0 256)">
      <rect width="472" height="90" rx="16" fill="#131C2E" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- mini block: gold -->
      <g transform="translate(22 24)">
        <polygon points="0,14.3 10,19.6 10,29.6 0,24.3" fill="#D9A441"/>
        <polygon points="20,14.3 10,19.6 10,29.6 20,24.3" fill="#B4832B"/>
        <polygon points="10,9 20,14.3 10,19.6 0,14.3" fill="#FBBF24"/>
        <polygon points="7,13.6 10,15.2 7,16.8 4,15.2" fill="#FDE68A" opacity="0.9"/>
      </g>
      <!-- payout -->
      <text x="428" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="26" font-weight="700" fill="#FBBF24">+320</text>
      <text x="72" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="700" fill="#F1F5F9">归档结算</text>
      <text x="72" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="16" fill="#94A3B8">按贡献结算积分 · 解锁称号</text>
    </g>
  </g>
</svg>
