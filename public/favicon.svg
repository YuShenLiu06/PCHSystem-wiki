<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">PCHSystem 徽标</title>
  <desc id="d">Minecraft 风格像素方块:草绿顶面、土褐侧面,中央白色像素字母 P,四周伴随像素颗粒。</desc>

  <!-- 协作像素颗粒(等距对角线方位) -->
  <rect x="50" y="4"  width="6" height="6" rx="2" fill="#4ADE80" opacity="0.45"/>
  <rect x="4"  y="28" width="5" height="5" rx="1.5" fill="#4ADE80" opacity="0.30"/>
  <rect x="52" y="50" width="7" height="7" rx="2" fill="#4ADE80" opacity="0.60"/>

  <!-- 左面:dirt 明面 -->
  <polygon points="12,24 32,34 32,54 12,44" fill="#7C5A3C"/>
  <!-- 右面:dirt 阴面 -->
  <polygon points="32,34 52,24 52,44 32,54" fill="#5A4028"/>

  <!-- 草皮檐(Groundcover lip,三面向下 4px) -->
  <polygon points="12,24 32,34 32,38 12,28" fill="#31A04C"/>
  <polygon points="32,34 52,24 52,28 32,38" fill="#278A3E"/>
  <polygon points="32,14 52,24 32,34 12,24" fill="#4ADE80"/>

  <!-- 草皮像素噪点 -->
  <polygon points="26,22.5 30,24.5 26,26.5 22,24.5" fill="#31A04C"/>
  <polygon points="39,22.5 43,24.5 39,26.5 35,24.5" fill="#31A04C" opacity="0.75"/>
  <rect x="44" y="38" width="4" height="4" fill="#4A3322" opacity="0.5" transform="skewY(-26)"/>
  <rect x="16" y="37" width="4" height="4" fill="#6B4C33" opacity="0.6" transform="skewY(26)"/>

  <!-- 白色像素 P(右面中央,沿面透视) -->
  <g fill="#F1F5F9" stroke="#5A4028" stroke-width="0.6">
    <polygon points="36,34.5 42,31.5 42,33.5 36,36.5"/>
    <polygon points="36,36.5 40,34.5 40,36.5 36,38.5"/>
    <polygon points="42,31.5 44,30.5 44,32.5 42,33.5"/>
  </g>
</svg>
