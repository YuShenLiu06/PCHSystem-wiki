<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">PCHSystem 工件流水线</title>
  <desc id="d">像素方块徽标衔接材料收集、施工建造、归档结算三阶段流水线,末端为 !!PCH bind 命令与结算积分。</desc>

  <defs>
    <!-- 地砖缝:过链处断开 -->
    <clipPath id="beltClip">
      <rect x="52" y="120" width="856" height="60"/>
    </clipPath>
  </defs>

  <!-- ===== 中央像素地砖传送带 ===== -->
  <g clip-path="url(#beltClip)">
    <rect x="52" y="141" width="856" height="18" fill="#1F2D44"/>
    <g fill="#2C3D5C">
      <rect x="52" y="141" width="28" height="18"/><rect x="116" y="141" width="28" height="18"/>
      <rect x="180" y="141" width="28" height="18"/><rect x="244" y="141" width="28" height="18"/>
      <rect x="308" y="141" width="28" height="18"/><rect x="372" y="141" width="28" height="18"/>
      <rect x="436" y="141" width="28" height="18"/><rect x="500" y="141" width="28" height="18"/>
      <rect x="564" y="141" width="28" height="18"/><rect x="628" y="141" width="28" height="18"/>
      <rect x="692" y="141" width="28" height="18"/><rect x="756" y="141" width="28" height="18"/>
      <rect x="820" y="141" width="28" height="18"/><rect x="884" y="141" width="24" height="18"/>
    </g>
  </g>

  <!-- ===== 起点:像素方块徽标 ===== -->
  <g transform="translate(52 66) scale(1.05)">
    <rect x="50" y="4"  width="6" height="6" rx="2" fill="#4ADE80" opacity="0.45"/>
    <rect x="4"  y="28" width="5" height="5" rx="1.5" fill="#4ADE80" opacity="0.30"/>
    <rect x="52" y="50" width="7" height="7" rx="2" fill="#4ADE80" opacity="0.60"/>
    <polygon points="12,24 32,34 32,54 12,44" fill="#7C5A3C"/>
    <polygon points="32,34 52,24 52,44 32,54" fill="#5A4028"/>
    <polygon points="12,24 32,34 32,38 12,28" fill="#31A04C"/>
    <polygon points="32,34 52,24 52,28 32,38" fill="#278A3E"/>
    <polygon points="32,14 52,24 32,34 12,24" fill="#4ADE80"/>
    <polygon points="26,22.5 30,24.5 26,26.5 22,24.5" fill="#31A04C"/>
    <polygon points="39,22.5 43,24.5 39,26.5 35,24.5" fill="#31A04C" opacity="0.75"/>
    <g fill="#F1F5F9" stroke="#5A4028" stroke-width="0.6">
      <polygon points="36,34.5 42,31.5 42,33.5 36,36.5"/>
      <polygon points="36,36.5 40,34.5 40,36.5 36,38.5"/>
      <polygon points="42,31.5 44,30.5 44,32.5 42,33.5"/>
    </g>
  </g>

  <!-- ===== 链节 1:材料收集 ===== -->
  <g transform="translate(228 78)">
    <rect width="188" height="124" rx="16" fill="#131C2E" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1.5"/>
    <g transform="translate(22 24)">
      <polygon points="0,13 10,18.3 10,29 0,23.7" fill="#7C5A3C"/>
      <polygon points="20,13 10,18.3 10,29 20,23.7" fill="#5A4028"/>
      <polygon points="0,13 10,18.3 10,21 0,15.7" fill="#31A04C"/>
      <polygon points="20,13 10,18.3 10,21 20,15.7" fill="#278A3E"/>
      <polygon points="10,7.7 20,13 10,18.3 0,13" fill="#4ADE80"/>
    </g>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" font-weight="700" fill="#F1F5F9">材料收集</text>
    <text x="22" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="14" fill="#94A3B8">认领 · 上交 · 交付</text>
    <text x="166" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700" fill="#4ADE80">×1,024</text>
  </g>

  <!-- 箭头 1 -->
  <g stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M424 140 H 446"/>
    <path d="M441 134 L451 140 L441 146"/>
  </g>

  <!-- ===== 链节 2:施工建造 ===== -->
  <g transform="translate(460 78)">
    <rect width="188" height="124" rx="16" fill="#131C2E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <g transform="translate(22 24)">
      <polygon points="0,13 10,18.3 10,29 0,23.7" fill="#8B93A1"/>
      <polygon points="20,13 10,18.3 10,29 20,23.7" fill="#6B7280"/>
      <polygon points="10,7.7 20,13 10,18.3 0,13" fill="#CBD5E1"/>
      <path d="M2.5,18.6 10,22.8 M10,24 17.5,19.8" stroke="#4B5563" stroke-width="1" opacity="0.6" fill="none"/>
    </g>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" font-weight="700" fill="#F1F5F9">施工建造</text>
    <text x="22" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="14" fill="#94A3B8">贡献追踪 · 可归因</text>
    <rect x="98" y="26" width="68" height="9" rx="4.5" fill="#1F2D44"/>
    <rect x="98" y="26" width="49" height="9" rx="4.5" fill="#38BDF8"/>
    <text x="166" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#38BDF8">72%</text>
  </g>

  <!-- 箭头 2 -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M656 140 H 678"/>
    <path d="M673 134 L683 140 L673 146"/>
  </g>

  <!-- ===== 链节 3:归档结算 ===== -->
  <g transform="translate(692 78)">
    <rect width="188" height="124" rx="16" fill="#131C2E" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="1.5"/>
    <g transform="translate(22 24)">
      <polygon points="0,13 10,18.3 10,29 0,23.7" fill="#D9A441"/>
      <polygon points="20,13 10,18.3 10,29 20,23.7" fill="#B4832B"/>
      <polygon points="10,7.7 20,13 10,18.3 0,13" fill="#FBBF24"/>
      <polygon points="7,12.6 10,14.2 7,15.8 4,14.2" fill="#FDE68A"/>
    </g>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" font-weight="700" fill="#F1F5F9">归档结算</text>
    <text x="22" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="14" fill="#94A3B8">积分 · 称号 · 排行</text>
    <text x="166" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700" fill="#FBBF24">+320</text>
  </g>

  <!-- ===== 底部终端带 ===== -->
  <g transform="translate(52 234)">
    <rect width="420" height="44" rx="12" fill="#0F1B30" stroke="#1F2D44"/>
    <rect x="14" y="12" width="8" height="8" fill="#E24A4A" rx="4"/>
    <rect x="28" y="12" width="8" height="8" fill="#FBBF24" rx="4"/>
    <rect x="42" y="12" width="8" height="8" fill="#4ADE80" rx="4"/>
    <text x="66" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#55677F">$</text>
    <text x="84" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#4ADE80">!!PCH bind</text>
    <rect x="192" y="13" width="9" height="17" fill="#4ADE80" opacity="0.75"/>
  </g>
  <text x="908" y="263" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" fill="#55677F">MCDR · FastAPI · Vue 3</text>
</svg>
